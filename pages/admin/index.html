<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — IMMOYA Admin</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../src/css/styles.css" />
</head>
<body class="md:flex">
  <div id="admin-sidebar"></div>

  <main class="flex-1 p-6 md:p-10 max-w-6xl">
    <div class="flex items-center justify-between mb-1">
      <div>
        <h1 class="text-2xl md:text-3xl text-ink">Tableau de bord</h1>
        <p class="text-sm text-ink/50 mt-1">Bienvenue sur votre espace administrateur.</p>
      </div>
      <span id="untera-status" class="text-xs px-3 py-1 rounded-full bg-ink/5 text-ink/60"></span>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-10 mt-8">
      <div class="card p-5">
        <p class="text-xs text-ink/50">Total biens</p>
        <p id="stat-total" class="text-3xl font-bold text-ink mt-1">—</p>
        <p class="text-xs text-ink/40 mt-1">Dont <span id="stat-disponibles">—</span> disponible(s)</p>
      </div>
      <div class="card p-5">
        <p class="text-xs text-ink/50">Vendus / Loués</p>
        <p class="text-3xl font-bold text-ink mt-1"><span id="stat-vendus">—</span> / <span id="stat-loues">—</span></p>
        <p class="text-xs text-ink/40 mt-1">Transactions conclues</p>
      </div>
      <div class="card p-5">
        <p class="text-xs text-ink/50">Demandes reçues</p>
        <p id="stat-demandes" class="text-3xl font-bold text-ink mt-1">—</p>
        <p class="text-xs text-ink/40 mt-1"><span id="stat-visites">—</span> demande(s) de visite</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
      <div class="card p-5">
        <h2 class="text-sm font-semibold text-ink mb-4">Répartition par type de bien</h2>
        <div id="type-breakdown" class="space-y-3"></div>
      </div>
      <div class="card p-5">
        <h2 class="text-sm font-semibold text-ink mb-4">Dernières demandes</h2>
        <div id="recent-requests" class="space-y-3"></div>
      </div>
    </div>

    <h2 class="text-xl text-ink mb-4">Derniers biens ajoutés</h2>
    <div class="card p-5 overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead>
          <tr class="border-b border-line text-ink/50">
            <th class="py-2 pr-4">Titre</th>
            <th class="py-2 pr-4">Ville</th>
            <th class="py-2 pr-4">Prix</th>
            <th class="py-2 pr-4">Statut</th>
          </tr>
        </thead>
        <tbody id="recent-properties-body"></tbody>
      </table>
    </div>
  </main>

  <script src="../../src/js/admin-guard.js"></script>
  <script src="../../src/js/format.js"></script>
  <script src="../../src/components/admin-sidebar.js"></script>
  <script src="../../src/js/admin-dashboard.js"></script>
  <script>renderAdminSidebar("admin-sidebar", "dashboard");</script>
</body>
</html>
