<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajouter / modifier un bien — IMMOYA Admin</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../src/css/styles.css" />
</head>
<body class="md:flex">
  <div id="admin-sidebar"></div>

  <main class="flex-1 p-6 md:p-10 max-w-3xl">
    <h1 id="form-title" class="font-display text-2xl md:text-3xl text-ink mb-8">Ajouter un bien</h1>

    <form id="property-form" class="card p-6 md:p-8 space-y-5">
      <div>
        <label class="block text-xs text-ink/60 mb-1">Titre</label>
        <input type="text" name="title" required class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm" />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-ink/60 mb-1">Type</label>
          <select name="type" required class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm bg-white">
            <option value="Appartement">Appartement</option>
            <option value="Maison">Maison</option>
            <option value="Villa">Villa</option>
            <option value="Studio">Studio</option>
            <option value="Duplex">Duplex</option>
            <option value="Terrain">Terrain</option>
            <option value="Bureau">Bureau</option>
            <option value="Commerce">Commerce</option>
            <option value="Entrepôt">Entrepôt</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-ink/60 mb-1">Transaction</label>
          <select name="transaction" required class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm bg-white">
            <option value="vente">Vente</option>
            <option value="location">Location</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-4">
        <div>
          <label class="block text-xs text-ink/60 mb-1">Prix</label>
          <input type="number" name="price" required class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-ink/60 mb-1">Devise</label>
          <select name="currency" class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm bg-white">
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
            <option value="GBP">GBP</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-ink/60 mb-1">Statut</label>
          <select name="status" class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm bg-white">
            <option value="disponible">Disponible</option>
            <option value="vendu">Vendu</option>
            <option value="loué">Loué</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-ink/60 mb-1">Ville</label>
          <input type="text" name="city" required class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-ink/60 mb-1">Adresse</label>
          <input type="text" name="address" class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm" />
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs text-ink/60 mb-1">Surface (m²)</label>
          <input type="number" name="surface" class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-ink/60 mb-1">Chambres</label>
          <input type="number" name="bedrooms" class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-ink/60 mb-1">Salles de bain</label>
          <input type="number" name="bathrooms" class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-ink/60 mb-1">Parking</label>
          <input type="number" name="parking" class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm" />
        </div>
      </div>

      <div>
        <label class="block text-xs text-ink/60 mb-1">Description</label>
        <textarea name="description" rows="4" class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm"></textarea>
      </div>

      <div>
        <label class="block text-xs text-ink/60 mb-1">Équipements (séparés par des virgules)</label>
        <input type="text" name="amenities" placeholder="Piscine, Jardin, Climatisation" class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm" />
      </div>

      <div>
        <label class="block text-xs text-ink/60 mb-1">Photos (une URL par ligne)</label>
        <textarea name="images" rows="3" placeholder="https://..." class="w-full border border-ink/15 rounded-card px-3 py-2 text-sm"></textarea>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit" class="btn-primary text-sm">Enregistrer</button>
        <a href="properties.html" class="btn-secondary text-sm">Annuler</a>
      </div>
      <p id="form-feedback"></p>
    </form>
  </main>

  <script src="../../src/js/admin-guard.js"></script>
  <script src="../../src/js/api.js"></script>
  <script src="../../src/components/admin-sidebar.js"></script>
  <script src="../../src/js/admin-property-form.js"></script>
  <script>renderAdminSidebar("admin-sidebar", "properties");</script>
</body>
</html>
