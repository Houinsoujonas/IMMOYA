<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demandes — IMMOYA Admin</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../src/css/styles.css" />
</head>
<body class="md:flex">
  <div id="admin-sidebar"></div>

  <main class="flex-1 p-6 md:p-10 max-w-6xl">
    <h1 class="font-display text-2xl md:text-3xl text-ink mb-8">Demandes</h1>

    <div class="flex flex-wrap gap-3 mb-6">
      <select id="filter-type" class="border border-ink/15 rounded-card px-3 py-2 text-sm bg-white">
        <option value="">Tous types</option>
        <option value="contact">Contact</option>
        <option value="visite">Visite</option>
      </select>
      <select id="filter-status" class="border border-ink/15 rounded-card px-3 py-2 text-sm bg-white">
        <option value="">Tous statuts</option>
        <option value="Nouveau">Nouveau</option>
        <option value="En cours">En cours</option>
        <option value="Traité">Traité</option>
        <option value="Archivé">Archivé</option>
      </select>
    </div>

    <div class="card p-5 overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead>
          <tr class="border-b border-ink/10 text-ink/50">
            <th class="py-2 pr-4">Demande</th>
            <th class="py-2 pr-4">Bien</th>
            <th class="py-2 pr-4">Client</th>
            <th class="py-2 pr-4">Type</th>
            <th class="py-2 pr-4">Message</th>
            <th class="py-2 pr-4">Date</th>
            <th class="py-2 pr-4">Statut</th>
          </tr>
        </thead>
        <tbody id="requests-body"></tbody>
      </table>
    </div>
  </main>

  <script src="../../src/js/admin-guard.js"></script>
  <script src="../../src/js/format.js"></script>
  <script src="../../src/components/admin-sidebar.js"></script>
  <script src="../../src/js/admin-requests.js"></script>
  <script>renderAdminSidebar("admin-sidebar", "requests");</script>
</body>
</html>
