<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biens à vendre — IMMOYA</title>
  <meta name="description" content="Parcourez des biens réels au Portugal, en France, en Italie et aux États-Unis." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../src/css/styles.css" />
</head>
<body>
  <div id="navbar"></div>

  <!-- Bandeau photo (annonce réelle Untera) avec titre en surimpression, conforme à la maquette -->
  <section id="catalog-hero" class="relative bg-accent-navy text-white overflow-hidden min-h-[85vh] md:min-h-[88vh] flex items-center">
    <img data-hero-photo alt="" class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-700" />
    <div class="absolute inset-0 bg-gradient-to-r from-black/60 via-black/25 to-transparent"></div>
    <div class="absolute inset-x-0 bottom-0 h-1/3 bg-gradient-to-t from-black/40 to-transparent"></div>
    <div class="relative w-full max-w-7xl mx-auto px-4 md:px-8 py-12 md:py-16">
      <h1 class="text-4xl md:text-6xl font-bold leading-tight">Tous nos biens</h1>
      <p class="text-white/85 mt-4 max-w-xl text-sm md:text-base">Des annonces réelles au Portugal, en France, en Italie et aux États-Unis.</p>
      <a href="#filters-form" class="btn-primary inline-flex items-center gap-2 mt-8 text-sm">Voir les annonces ↓</a>
      <p class="hidden mt-3 text-[11px] text-white/70">
        <span data-i18n="hero.photoCredit">Photo : annonce réelle —</span>
        <a data-hero-credit class="underline hover:text-white"></a>
      </p>
    </div>
  </section>

  <main class="max-w-7xl mx-auto px-4 md:px-8 pt-8 pb-12">

    <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
      <!-- Colonne de filtres : uniquement les critères réellement supportés (pays, budget),
           le type est appliqué côté client sur les résultats reçus -->
      <aside class="md:col-span-1">
        <form id="filters-form" class="card p-5 space-y-4 scroll-mt-24">
          <div>
            <label class="block text-xs text-ink/60 mb-1">Pays</label>
            <select id="filter-country" name="country" class="w-full border border-line rounded-full px-3 py-2 bg-white text-sm">
              <option value="">Tous les pays ciblés</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-ink/60 mb-1">Type de bien</label>
            <select id="filter-type" name="type" class="w-full border border-line rounded-full px-3 py-2 bg-white text-sm">
              <option value="">Tous les types</option>
              <option value="Maison">Maison</option>
              <option value="Appartement">Appartement</option>
              <option value="Villa">Villa</option>
              <option value="Résidentiel">Résidentiel</option>
              <option value="Terrain">Terrain</option>
              <option value="Bureau">Bureau</option>
              <option value="Commerce">Commerce</option>
            </select>
            <p class="text-[11px] text-ink/40 mt-1">Appliqué sur les résultats chargés (Untera ne propose pas de filtre par type côté serveur).</p>
          </div>
          <div>
            <label for="filter-max-price" class="block text-xs text-ink/60 mb-1">Budget max</label>
            <div class="flex border border-line rounded-full bg-white overflow-hidden">
              <input type="number" min="0" step="1000" id="filter-max-price" name="maxPrice" placeholder="Ex. 300 000" class="flex-1 min-w-0 px-3 py-2 text-sm outline-none" />
              <select id="filter-currency" name="currency" aria-label="Devise du budget" class="border-l border-line bg-background/60 px-2 text-sm font-medium text-ink/70 outline-none">
                <option value="EUR">€ EUR</option>
                <option value="USD">$ USD</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn-primary text-sm w-full">Filtrer</button>
        </form>
      </aside>

      <!-- Zone de résultats -->
      <section class="md:col-span-3">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
          <p id="results-count" class="text-sm text-ink/60"></p>
          <select id="sort-select" class="border border-line rounded-full px-3 py-2 text-sm bg-white">
            <option value="default">Pertinence</option>
            <option value="price-asc">Prix croissant</option>
            <option value="price-desc">Prix décroissant</option>
          </select>
        </div>

        <div id="results-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>

        <p id="external-attribution" class="text-xs text-ink/40 mt-10"></p>
      </section>
    </div>
  </main>

  <div id="footer"></div>

  <script src="../src/js/format.js"></script>
  <script src="../src/js/favorites.js"></script>
  <script src="../src/js/api.js"></script>
  <script src="../src/js/i18n.js"></script>
  <script src="../src/components/navbar.js"></script>
  <script src="../src/components/footer.js"></script>
  <script src="../src/components/property-card.js"></script>
  <script src="../src/components/search-box.js"></script>
  <script src="../src/js/catalog.js"></script>
  <script src="../src/js/animations.js"></script>
  <script src="../src/js/app.js"></script>
</body>
</html>
